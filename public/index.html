<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipStack</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a1a;
    --sidebar: #111111;
    --surface: #222222;
    --surface-hover: #2a2a2a;
    --border: #2e2e2e;
    --text: #e8e8e8;
    --text-muted: #888;
    --text-dim: #555;
    --accent: #d97706;
    --accent-soft: rgba(217,119,6,0.12);
    --red: #ef4444;
    --red-soft: rgba(239,68,68,0.1);
    --green: #22c55e;
    --radius: 8px;
    --sidebar-w: 280px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Geist', 'SF Pro Text', -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  .layout {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 18px 16px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .logo-icon {
    width: 24px;
    height: 24px;
    background: var(--accent);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
  }

  .logo-text {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.3px;
    color: var(--text);
  }

  .search-wrap {
    position: relative;
  }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
    font-size: 13px;
  }

  .search {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 10px 7px 30px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }

  .search::placeholder { color: var(--text-dim); }
  .search:focus { border-color: #444; }

  .section-label {
    padding: 14px 16px 6px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .clip-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 12px;
  }

  .clip-list::-webkit-scrollbar { width: 4px; }
  .clip-list::-webkit-scrollbar-track { background: transparent; }
  .clip-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  .clip-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 8px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.1s;
    position: relative;
  }

  .clip-item:hover { background: var(--surface-hover); }
  .clip-item.active { background: var(--surface); }

  .clip-item-text {
    flex: 1;
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .clip-item.active .clip-item-text { color: var(--text); }
  .clip-item:hover .clip-item-text { color: var(--text); }

  .clip-delete {
    opacity: 0;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    font-size: 13px;
    flex-shrink: 0;
    transition: opacity 0.1s, color 0.1s;
    line-height: 1;
  }

  .clip-item:hover .clip-delete { opacity: 1; }
  .clip-delete:hover { color: var(--red) !important; }

  .empty-state {
    padding: 24px 16px;
    color: var(--text-dim);
    font-size: 12.5px;
    text-align: center;
    line-height: 1.6;
  }

  .sidebar-footer {
    padding: 10px 16px 14px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    margin-right: 6px;
    transition: background 0.3s;
    vertical-align: middle;
  }

  .status-dot.connected { background: var(--green); }

  .status-text {
    font-size: 11.5px;
    color: var(--text-dim);
    vertical-align: middle;
  }

  /* ── MAIN ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
  }

  .main-header {
    padding: 20px 28px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .main-title {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 400;
  }

  .main-title span {
    color: var(--text);
    font-weight: 500;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: var(--radius);
    padding: 6px 12px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn:hover { background: var(--surface-hover); color: var(--text); border-color: #444; }

  .btn-danger:hover { color: var(--red); border-color: var(--red-soft); background: var(--red-soft); }

  .btn-primary {
    background: var(--accent-soft);
    border-color: rgba(217,119,6,0.3);
    color: var(--accent);
  }
  .btn-primary:hover { background: rgba(217,119,6,0.2); color: var(--accent); }

  /* Content area */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 24px 28px;
    gap: 20px;
  }

  /* Viewer */
  .viewer {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .viewer-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .char-count {
    font-size: 11.5px;
    color: var(--text-dim);
    margin-left: auto;
  }

  .viewer-box {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    overflow-y: auto;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 13px;
    line-height: 1.65;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 120px;
    cursor: text;
  }

  .viewer-box::-webkit-scrollbar { width: 4px; }
  .viewer-box::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  .viewer-box.placeholder { color: var(--text-dim); font-family: inherit; font-style: italic; }

  /* Input area */
  .input-area {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .paste-box {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    color: var(--text);
    font-size: 13.5px;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 72px;
    max-height: 200px;
    transition: border-color 0.15s;
    line-height: 1.5;
  }

  .paste-box::placeholder { color: var(--text-dim); }
  .paste-box:focus { border-color: #444; }

  .send-btn {
    background: var(--accent);
    border: none;
    color: #000;
    border-radius: var(--radius);
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
    align-self: flex-end;
    height: 38px;
  }

  .send-btn:hover { opacity: 0.85; }
  .send-btn:disabled { opacity: 0.4; cursor: default; }

  .input-hint {
    font-size: 11.5px;
    color: var(--text-dim);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 16px;
    font-size: 13px;
    color: var(--text);
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.2s;
    pointer-events: none;
    z-index: 100;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* Source badge */
  .source-badge {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--surface);
    color: var(--text-dim);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  /* No results */
  .no-results {
    padding: 20px 16px;
    color: var(--text-dim);
    font-size: 12.5px;
    text-align: center;
  }

  mark {
    background: rgba(217,119,6,0.25);
    color: var(--text);
    border-radius: 2px;
    padding: 0 1px;
  }
</style>
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">📋</div>
        <div class="logo-text">ClipStack</div>
      </div>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input class="search" id="search" type="text" placeholder="Search clips…" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <div class="section-label" id="section-label">Recents</div>

    <div class="clip-list" id="clip-list">
      <div class="empty-state">No clips yet.<br>Paste something below to get started.</div>
    </div>

    <div class="sidebar-footer">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-text">Connecting…</span>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="main-header">
      <div class="main-title" id="main-title">
        <span>ClipStack</span> — select a clip or paste new content
      </div>
      <div class="header-actions">
        <button class="btn" id="copy-btn" style="display:none">Copy to clipboard</button>
        <button class="btn btn-danger" id="clear-btn">Clear all</button>
      </div>
    </div>

    <div class="content">
      <div class="viewer">
        <div class="viewer-toolbar">
          <span style="font-size:12px;color:var(--text-dim)" id="viewer-label">Nothing selected</span>
          <span class="char-count" id="char-count"></span>
        </div>
        <div class="viewer-box placeholder" id="viewer">Select a clip from the sidebar to view its full content.</div>
      </div>

      <div class="input-area">
        <div class="input-row">
          <textarea class="paste-box" id="paste-box" placeholder="Paste or type something to add to ClipStack… (Ctrl+Enter to send)"></textarea>
          <button class="send-btn" id="send-btn">Add clip</button>
        </div>
        <div class="input-hint" id="input-hint">Ctrl+Enter to send &nbsp;·&nbsp; All connected browsers see new clips instantly</div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  // ── State ──
  let clips = [];
  let activeId = null;
  let ws = null;
  let searchQ = '';
  let searchQLower = '';
  let maxItems = 200;
  let reconnectTimer = null;

  function getSource() {
    try { const p = navigator.userAgentData?.platform; if (p) return p; } catch (_) {}
    return navigator.platform || 'browser';
  }

  // ── Elements ──
  const clipList = document.getElementById('clip-list');
  const viewer = document.getElementById('viewer');
  const viewerLabel = document.getElementById('viewer-label');
  const charCount = document.getElementById('char-count');
  const copyBtn = document.getElementById('copy-btn');
  const clearBtn = document.getElementById('clear-btn');
  const sendBtn = document.getElementById('send-btn');
  const pasteBox = document.getElementById('paste-box');
  const searchEl = document.getElementById('search');
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const sectionLabel = document.getElementById('section-label');
  const toast = document.getElementById('toast');
  const mainTitle = document.getElementById('main-title');

  // ── WebSocket ──
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}`);

    ws.onopen = () => {
      statusDot.className = 'status-dot connected';
      statusText.textContent = 'Connected';
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    };

    ws.onclose = () => {
      statusDot.className = 'status-dot';
      statusText.textContent = 'Reconnecting…';
      reconnectTimer = setTimeout(connect, 2500);
    };

    ws.onerror = () => ws.close();

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);

      if (msg.type === 'init') {
        clips = msg.clips;
        maxItems = msg.maxItems || 200;
        renderList();
      }

      if (msg.type === 'add') {
        clips = clips.filter(c => c.id !== msg.clip.id);
        clips.unshift(msg.clip);
        if (clips.length > maxItems) clips.length = maxItems;
        renderList();
        if (!activeId) selectClip(msg.clip.id);
      }

      if (msg.type === 'delete') {
        clips = clips.filter(c => c.id !== msg.id);
        if (activeId === msg.id) {
          activeId = null;
          showViewer(null);
        }
        renderList();
      }

      if (msg.type === 'clear') {
        clips = [];
        activeId = null;
        showViewer(null);
        renderList();
      }
    };
  }

  function send(msg) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
  }

  // ── Render sidebar list ──
  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function highlight(text, q) {
    if (!q) return escapeHtml(text);
    const idx = text.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return escapeHtml(text);
    return escapeHtml(text.slice(0, idx))
      + '<mark>' + escapeHtml(text.slice(idx, idx + q.length)) + '</mark>'
      + escapeHtml(text.slice(idx + q.length));
  }

  function renderList() {
    const filtered = searchQLower
      ? clips.filter(c => c.text.toLowerCase().includes(searchQLower))
      : clips;

    sectionLabel.textContent = searchQ
      ? `Results (${filtered.length})`
      : 'Recents';

    if (filtered.length === 0) {
      clipList.innerHTML = searchQ
        ? `<div class="no-results">No clips match "<strong>${escapeHtml(searchQ)}</strong>"</div>`
        : `<div class="empty-state">No clips yet.<br>Paste something below to get started.</div>`;
      return;
    }

    clipList.innerHTML = filtered.map(clip => `
      <div class="clip-item ${clip.id === activeId ? 'active' : ''}"
           data-id="${clip.id}"
           title="${escapeHtml(clip.text)}">
        <span class="clip-item-text">${highlight(clip.preview, searchQ)}</span>
        <button class="clip-delete" data-id="${clip.id}" title="Delete">✕</button>
      </div>
    `).join('');

    // Events
    clipList.querySelectorAll('.clip-item').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.classList.contains('clip-delete')) return;
        selectClip(parseInt(el.dataset.id));
      });
    });

    clipList.querySelectorAll('.clip-delete').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        send({ type: 'delete', id: parseInt(btn.dataset.id) });
      });
    });
  }

  // ── Viewer ──
  function selectClip(id) {
    const clip = clips.find(c => c.id === id);
    if (!clip) return;
    // Update active class in DOM without full re-render
    if (activeId !== null) {
      const prev = clipList.querySelector(`[data-id="${activeId}"]`);
      if (prev) prev.classList.remove('active');
    }
    activeId = id;
    const next = clipList.querySelector(`[data-id="${id}"]`);
    if (next) next.classList.add('active');
    showViewer(clip);
  }

  function showViewer(clip) {
    if (!clip) {
      viewer.textContent = 'Select a clip from the sidebar to view its full content.';
      viewer.className = 'viewer-box placeholder';
      viewerLabel.textContent = 'Nothing selected';
      charCount.textContent = '';
      copyBtn.style.display = 'none';
      mainTitle.innerHTML = '<span>ClipStack</span> — select a clip or paste new content';
      return;
    }

    viewer.textContent = clip.text;
    viewer.className = 'viewer-box';
    viewerLabel.textContent = new Date(clip.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
      + (clip.source && clip.source !== 'unknown' ? ` · ${clip.source}` : '');
    charCount.textContent = `${clip.text.length.toLocaleString()} chars`;
    copyBtn.style.display = '';
    mainTitle.innerHTML = `<span>${escapeHtml(clip.preview.slice(0,40))}${clip.preview.length > 40 ? '…' : ''}</span>`;
  }

  // ── Actions ──
  copyBtn.addEventListener('click', () => {
    const clip = clips.find(c => c.id === activeId);
    if (!clip) return;
    navigator.clipboard.writeText(clip.text).then(() => showToast('Copied to clipboard'));
  });

  clearBtn.addEventListener('click', () => {
    if (!clips.length) return;
    if (confirm('Clear all clips? This affects all connected devices.')) {
      send({ type: 'clear' });
    }
  });

  sendBtn.addEventListener('click', addClip);

  pasteBox.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      addClip();
    }
  });

  pasteBox.addEventListener('input', () => {
    sendBtn.disabled = !pasteBox.value.trim();
  });

  function addClip() {
    const text = pasteBox.value.trim();
    if (!text) return;
    send({ type: 'add', text, source: getSource() });
    pasteBox.value = '';
    sendBtn.disabled = true;
    showToast('Clip added');
  }

  // ── Search ──
  searchEl.addEventListener('input', () => {
    searchQ = searchEl.value.trim();
    searchQLower = searchQ.toLowerCase();
    renderList();
  });

  // ── Toast ──
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // ── Init ──
  sendBtn.disabled = true;
  connect();
</script>
</body>
</html>
