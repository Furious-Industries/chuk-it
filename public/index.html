<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chuk-it</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">📋</div>
        <div class="logo-text">Chuk-it</div>
      </div>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input class="search" id="search" aria-label="Search clips" type="text" placeholder="Search clips…" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <div class="section-label" id="section-label">Recents</div>

    <div class="clip-list" id="clip-list">
      <div class="empty-state">No clips yet.<br>Paste something below to get started.</div>
    </div>

    <div class="sidebar-footer">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-text">Connecting…</span>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="main-header">
      <div class="main-title" id="main-title">
        <span>Chuk-it</span> — select a clip or paste new content
      </div>
      <div class="header-actions">
        <button class="btn" id="copy-btn" hidden>Copy to clipboard</button>
        <button class="btn btn-danger" id="clear-btn">Clear all</button>
      </div>
    </div>

    <div class="content">
      <div class="viewer">
        <div class="viewer-toolbar">
          <span class="viewer-label" id="viewer-label">Nothing selected</span>
          <span class="char-count" id="char-count"></span>
        </div>
        <div class="viewer-box placeholder" id="viewer">Select a clip from the sidebar to view its full content.</div>
        <textarea id="manual-copy" class="viewer-box" readonly hidden aria-label="Selected clip for manual copy" spellcheck="false"></textarea>
      </div>

      <div class="input-area">
        <div class="input-row">
          <textarea class="paste-box" id="paste-box" aria-label="New clip" autocomplete="off" spellcheck="false" placeholder="Paste or type something to add to Chuk-it… (Ctrl+Enter to send)"></textarea>
          <button class="send-btn" id="send-btn">Add clip</button>
        </div>
        <div id="delivery-status" role="status" aria-live="polite"></div>
        <button class="btn" id="cancel-pending" hidden>Keep draft and stop retrying</button>
        <div class="input-hint" id="input-hint">Ctrl+Enter to send &nbsp;·&nbsp; All connected browsers see new clips instantly</div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast" role="status"></div>

<script src="/app.js" defer></script>
</body>
</html>
