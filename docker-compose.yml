services:
  chuk-it:
    build: .
    container_name: chuk-it
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:?Set BIND_ADDRESS to your chosen LAN or VPN IPv4 address}:3457:3457"
    environment:
      PORT: "3457"
      BIND_ADDRESS: "0.0.0.0"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:?Set the exact HTTPS origins that you use}"
    volumes:
      - ./certs:/app/certs:ro
    user: "node"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 100
